[workspace]
members = ["crates/*"]     # every folder in crates/ is part of the project
resolver = "3"             # how Cargo picks dependency versions (the modern default)

[workspace.package]
edition = "2024"           # shared settings that members can inherit

[workspace.dependencies]   # pin each external crate's version ONCE, here
rand = "0.10.3"           # "=" means exactly this version
rand_chacha = "0.10.0"
rand_distr = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.dev.package."*"]  # build settings
opt-level = 3              # optimize dependencies even in debug builds